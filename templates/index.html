<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Cámara RTSP</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        /* Estilos específicos de esta página */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 10px 18px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .video-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .camera-selector {
            margin-bottom: 20px;
        }
        
        .info {
            margin-top: 15px;
            text-align: center;
            color: #1e293b;
            font-size: 0.9em;
        }
        
        #mosaicContainer {
            width: 100%;
        }
    </style>
</head>
<body>
    {% include 'partials/navbar.html' %}
    
    <div class="container">
        <h1>📹 Visor de Cámaras RTSP</h1>
        
        <div class="video-container">
            <div class="camera-selector">
                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center;">
                    <div id="cameraCheckboxes" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
                    <button onclick="updateMosaic()" style="padding: 8px 16px; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.background='#1e3a8a'" onmouseout="this.style.background='#1e40af'">🔄 Actualizar Vista</button>
                </div>
            </div>
            
            <div id="mosaicContainer" style="display: grid; gap: 10px; margin-top: 20px;"></div>
            
            <div class="info">
                <p>Stream en tiempo real con FFmpeg - Selecciona una o más cámaras para vista en mosaico</p>
            </div>
        </div>
    </div>
    
    <script>
        let availableCameras = {};
        
        // Cargar lista de cámaras disponibles
        fetch('/api/cameras')
            .then(response => response.json())
            .then(cameras => {
                availableCameras = cameras;
                const container = document.getElementById('cameraCheckboxes');
                container.innerHTML = '';
                
                for (const [id, info] of Object.entries(cameras)) {
                    const label = document.createElement('label');
                    label.style.cssText = 'display: flex; align-items: center; gap: 5px; padding: 8px 12px; background: white; border-radius: 6px; cursor: pointer; font-weight: 600;';
                    label.innerHTML = `
                        <input type="checkbox" value="${id}" checked>
                        ${info.name}
                    `;
                    container.appendChild(label);
                }
                
                updateMosaic();
            })
            .catch(err => console.error('Error cargando cámaras:', err));
        
        function updateMosaic() {
            const checkboxes = document.querySelectorAll('#cameraCheckboxes input[type="checkbox"]:checked');
            const container = document.getElementById('mosaicContainer');
            
            if (checkboxes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">Selecciona al menos una cámara</p>';
                return;
            }
            
            // Calculate grid layout
            let columns = 1;
            if (checkboxes.length === 2) columns = 2;
            else if (checkboxes.length <= 4) columns = 2;
            else if (checkboxes.length <= 9) columns = 3;
            else columns = 4;
            
            container.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            container.innerHTML = '';
            
            checkboxes.forEach(checkbox => {
                const cameraId = checkbox.value;
                const cameraInfo = availableCameras[cameraId];
                
                const streamDiv = document.createElement('div');
                streamDiv.style.cssText = 'position: relative; background: #000; border-radius: 10px; overflow: hidden;';
                streamDiv.innerHTML = `
                    <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 5px; font-weight: 600; z-index: 10;">
                        ${cameraInfo.name}
                    </div>
                    <img src="/video_feed/${cameraId}?t=${Date.now()}" 
                         alt="${cameraInfo.name}" 
                         style="width: 100%; height: auto; display: block;"
                         onerror="this.parentElement.style.border='3px solid #ef4444'"
                         onload="this.parentElement.style.border='3px solid #10b981'">
                `;
                container.appendChild(streamDiv);
            });
        }
    </script>
</body>
</html>
