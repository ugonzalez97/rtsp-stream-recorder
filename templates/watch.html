<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproducir - {{ video }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .back-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: #5568d3;
        }
        
        .video-title {
            color: white;
            font-size: 1.5em;
            flex: 1;
            text-align: center;
            margin: 0 20px;
            word-break: break-word;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        video {
            max-width: 100%;
            max-height: calc(100vh - 100px);
            width: auto;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        
        .controls-info {
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            color: white;
            text-align: center;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/recordings_viewer" class="back-btn">← Volver</a>
        <div class="video-title">{{ video }}</div>
        <div style="width: 100px;"></div>
    </div>
    
    <div class="video-container">
        <video controls autoplay>
            <source src="/recordings/serve/{{ video }}" type="video/mp4">
            Tu navegador no soporta el elemento de video.
        </video>
    </div>
    
    <div class="controls-info">
        💡 Usa los controles del reproductor para pausar, ajustar volumen, pantalla completa, etc.
    </div>
</body>
</html>
